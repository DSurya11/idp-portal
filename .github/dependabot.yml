# Weekly dependency PRs; CI tests each one. Actions are pinned by SHA and Dependabot keeps
# the pins current (PLATFORM_REVIEW F11). Backstage core packages move together via
# `yarn backstage-cli versions:bump`, so Dependabot ignores @backstage/* and handles the rest.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups: {actions: {patterns: ["*"]}}
  - package-ecosystem: npm
    directory: /
    schedule: {interval: weekly}
    ignore:
      - dependency-name: "@backstage/*"
      # Majors (React 19, react-router 7+, ...) must match what Backstage supports; they move
      # with `backstage-cli versions:bump`, not one package at a time.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups: {npm: {patterns: ["*"], update-types: [minor, patch]}}
  - package-ecosystem: docker
    directory: /packages/backend
    schedule: {interval: weekly}
    ignore:
      # Node major must be in package.json "engines" (22 || 24)
      - dependency-name: node
        update-types: ["version-update:semver-major"]
