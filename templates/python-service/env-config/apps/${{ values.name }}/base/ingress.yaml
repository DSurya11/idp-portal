# Joins the shared ALB (group ff-idp): no new load balancer, no extra cost.
# group.order 10 < feature-flag-api's catch-all (1000), so /${{ values.name }} is matched first.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ values.name }}
  annotations:
    alb.ingress.kubernetes.io/group.name: ff-idp
    alb.ingress.kubernetes.io/group.order: "10"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /${{ values.name }}/health
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=10
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /${{ values.name }}
            pathType: Prefix
            backend:
              service:
                name: ${{ values.name }}
                port:
                  number: 8000
