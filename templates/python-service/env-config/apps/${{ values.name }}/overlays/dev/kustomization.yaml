# First deploy is pinned to the repo's initial commit, which that repo's CI builds and
# pushes. Merge this PR once that CI run is green (the pod pulls the image by this tag).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ${{ values.name }}
resources:
  - ../../base
images:
  - name: 693906847772.dkr.ecr.ap-south-1.amazonaws.com/svc/${{ values.name }}
    newTag: ${{ values.commitHash }}
