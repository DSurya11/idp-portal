# Golden-path CI. Copied WITHOUT templating: GitHub's ${{ }} syntax would clash with the
# scaffolder's, so the service name comes from the repository name at run time.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm         # native arm64 = the EKS nodes' architecture
    permissions:
      contents: read
      id-token: write                 # OIDC to AWS, no stored credentials
    env:
      REGISTRY: 693906847772.dkr.ecr.ap-south-1.amazonaws.com
      REPO: svc/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --build-arg GIT_SHA=${GITHUB_SHA} -t "${REGISTRY}/${REPO}:${GITHUB_SHA}" .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.REPO }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Configure AWS credentials via OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Narrow role: can only create/push ECR repos under svc/*
          role-to-assume: arn:aws:iam::693906847772:role/idp-service-ci
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! aws ecr describe-repositories --repository-names "$REPO" >/dev/null 2>&1; then
            aws ecr create-repository --repository-name "$REPO" \
              --image-tag-mutability IMMUTABLE \
              --image-scanning-configuration scanOnPush=true \
              --tags Key=Project,Value=idp Key=ManagedBy,Value=golden-path-ci
            aws ecr put-lifecycle-policy --repository-name "$REPO" --lifecycle-policy-text \
              '{"rules":[{"rulePriority":1,"description":"keep last 10","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'
          fi

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "${REGISTRY}/${REPO}:${GITHUB_SHA}"
